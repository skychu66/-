<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RAG 知识库问答系统</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: 'Microsoft YaHei', 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
  color: #e0e0e0;
  min-height: 100vh;
}
.header {
  background: linear-gradient(90deg, #1a1a3e 0%, #2d1b69 50%, #1a1a3e 100%);
  padding: 24px;
  text-align: center;
  border-bottom: 3px solid #7c3aed;
  box-shadow: 0 4px 20px rgba(124, 58, 237, 0.3);
}
.header h1 {
  color: #a78bfa;
  font-size: 32px;
  text-shadow: 0 0 20px rgba(167, 139, 250, 0.5);
  letter-spacing: 2px;
}
.header p {
  color: #8b8ba7;
  margin-top: 8px;
  font-size: 14px;
}
.container {
  max-width: 950px;
  margin: 24px auto;
  padding: 0 20px;
}
.status-bar {
  display: flex;
  gap: 16px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.status-item {
  background: linear-gradient(145deg, #1e1e3f, #2a2a5a);
  padding: 16px 24px;
  border-radius: 12px;
  border: 1px solid #3b0764;
  flex: 1;
  min-width: 140px;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  transition: transform 0.2s, box-shadow 0.2s;
}
.status-item:hover {
  transform: translateY(-2px);
  box-shadow: 0 6px 20px rgba(124, 58, 237, 0.2);
}
.status-item label {
  color: #8b8ba7;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 1px;
}
.status-item .value {
  color: #a78bfa;
  font-size: 24px;
  font-weight: bold;
  margin-top: 6px;
  text-shadow: 0 0 10px rgba(167, 139, 250, 0.3);
}
.chat-container {
  background: linear-gradient(145deg, #1a1a3e, #252550);
  border-radius: 16px;
  border: 1px solid #3b0764;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
}
.chat-header {
  background: linear-gradient(90deg, #2d1b69, #1a1a3e);
  padding: 16px 20px;
  border-bottom: 1px solid #3b0764;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.chat-header h3 {
  color: #a78bfa;
  font-size: 16px;
}
.chat-messages {
  height: 500px;
  overflow-y: auto;
  padding: 20px;
  background: rgba(0, 0, 0, 0.2);
}
.chat-messages::-webkit-scrollbar {
  width: 8px;
}
.chat-messages::-webkit-scrollbar-track {
  background: #1a1a3e;
}
.chat-messages::-webkit-scrollbar-thumb {
  background: #3b0764;
  border-radius: 4px;
}
.msg {
  margin-bottom: 20px;
  animation: fadeIn 0.3s ease-in;
}
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}
.msg.user {
  text-align: right;
}
.msg.user .bubble {
  background: linear-gradient(135deg, #7c3aed, #6d28d9);
  color: white;
  display: inline-block;
  padding: 12px 18px;
  border-radius: 18px 18px 4px 18px;
  max-width: 75%;
  box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
}
.msg.assistant .bubble {
  background: linear-gradient(145deg, #2a2a5a, #1e1e3f);
  color: #e0e0e0;
  display: inline-block;
  padding: 14px 18px;
  border-radius: 18px 18px 18px 4px;
  max-width: 88%;
  white-space: pre-wrap;
  word-break: break-word;
  border: 1px solid #3b0764;
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
}
.msg .source {
  color: #6b7280;
  font-size: 11px;
  margin-top: 6px;
  font-style: italic;
}
.input-area {
  display: flex;
  gap: 12px;
  padding: 20px;
  background: linear-gradient(180deg, #151530, #1a1a3e);
  border-top: 1px solid #3b0764;
}
.input-area textarea {
  flex: 1;
  background: #1a1a3e;
  border: 1px solid #3b0764;
  color: #e0e0e0;
  padding: 14px;
  border-radius: 12px;
  resize: none;
  height: 70px;
  font-size: 14px;
  font-family: inherit;
  transition: border-color 0.2s, box-shadow 0.2s;
}
.input-area textarea:focus {
  outline: none;
  border-color: #7c3aed;
  box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.2);
}
.input-area textarea::placeholder {
  color: #6b7280;
}
.btn {
  padding: 14px 28px;
  border: none;
  border-radius: 12px;
  cursor: pointer;
  font-size: 14px;
  font-weight: bold;
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.btn-primary {
  background: linear-gradient(135deg, #7c3aed, #6d28d9);
  color: white;
  box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3);
}
.btn-primary:hover {
  background: linear-gradient(135deg, #6d28d9, #5b21b6);
  transform: translateY(-1px);
  box-shadow: 0 6px 20px rgba(124, 58, 237, 0.4);
}
.btn-secondary {
  background: linear-gradient(145deg, #2a2a5a, #1e1e3f);
  color: #a78bfa;
  border: 1px solid #3b0764;
}
.btn-secondary:hover {
  background: linear-gradient(145deg, #3b0764, #2d1b69);
  border-color: #7c3aed;
}
.actions {
  display: flex;
  gap: 12px;
  padding: 14px 20px;
  background: linear-gradient(180deg, #1a1a3e, #151530);
  border-top: 1px solid #2d2d5e;
}
.loading {
  color: #6b7280;
  text-align: center;
  padding: 24px;
  font-style: italic;
}
.loading::before {
  content: '';
  display: inline-block;
  width: 16px;
  height: 16px;
  border: 2px solid #3b0764;
  border-top-color: #7c3aed;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-right: 8px;
  vertical-align: middle;
}
@keyframes spin {
  to { transform: rotate(360deg); }
}
.not-found {
  color: #ef4444;
  background: rgba(239, 68, 68, 0.1);
  border: 1px solid rgba(239, 68, 68, 0.3);
  padding: 12px 16px;
  border-radius: 12px;
  margin-top: 8px;
}
</style>
</head>
<body>
<div class="header">
  <h1>🤖 RAG 知识库问答系统</h1>
  <p>基于通义千问 + 本地 TXT 文件的智能问答助手</p>
</div>
<div class="container">
  <div class="status-bar">
    <div class="status-item">
      <label>📄 文本片段</label>
      <div class="value" id="chunkCount">0</div>
    </div>
    <div class="status-item">
      <label>📁 知识库文件</label>
      <div class="value" id="fileCount">0</div>
    </div>
    <div class="status-item">
      <label>💬 对话轮数</label>
      <div class="value" id="historyCount">0</div>
    </div>
    <div class="status-item">
      <label>✅ 状态</label>
      <div class="value" id="kbStatus">待加载</div>
    </div>
  </div>
  <div class="chat-container">
    <div class="chat-header">
      <h3>💭 对话窗口</h3>
      <span style="color: #6b7280; font-size: 12px;">支持 Enter 发送</span>
    </div>
    <div class="chat-messages" id="chatMessages"></div>
    <div class="input-area">
      <textarea id="questionInput" placeholder="输入你的问题，例如：DMA是什么？"></textarea>
      <button class="btn btn-primary" onclick="sendMessage()">🚀 发送</button>
    </div>
    <div class="actions">
      <button class="btn btn-secondary" onclick="loadKB()">🔄 刷新知识库</button>
      <button class="btn btn-secondary" onclick="clearHistory()">🗑️ 清空对话</button>
    </div>
  </div>
</div>
<script>
let loaded = false;
async function loadKB() {
  const res = await fetch('/api/load_kb', {method:'POST'});
  const data = await res.json();
  document.getElementById('kbStatus').textContent = '✅ 已加载';
  updateStatus();
  alert(data.status);
}
async function updateStatus() {
  const res = await fetch('/api/kb_status');
  const data = await res.json();
  document.getElementById('chunkCount').textContent = data.chunk_count;
  document.getElementById('fileCount').textContent = data.file_count;
  document.getElementById('historyCount').textContent = data.history_count;
}
async function sendMessage() {
  const input = document.getElementById('questionInput');
  const question = input.value.trim();
  if (!question) return;
  const messages = document.getElementById('chatMessages');
  messages.innerHTML += '<div class="msg user"><div class="bubble">' + escapeHtml(question) + '</div></div>';
  input.value = '';
  messages.innerHTML += '<div class="loading" id="loading">正在思考</div>';
  messages.scrollTop = messages.scrollHeight;
  const res = await fetch('/api/ask', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({question})
  });
  const data = await res.json();
  const loading = document.getElementById('loading');
  if (loading) loading.remove();
  const isNotFound = data.answer.includes('抱歉，还未录入');
  messages.innerHTML += '<div class="msg assistant"><div class="bubble">' + escapeHtml(data.answer) + '</div>';
  if (data.sources && data.sources.length > 0) {
    messages.lastElementChild.innerHTML += '<div class="source">📚 ' + data.sources.join(' | ') + '</div>';
  }
  if (isNotFound) {
    messages.lastElementChild.innerHTML += '<div class="not-found">⚠️ 该问题不在知识库范围内</div>';
  }
  messages.innerHTML += '</div>';
  messages.scrollTop = messages.scrollHeight;
  updateStatus();
}
function clearHistory() {
  fetch('/api/clear_history', {method:'POST'});
  document.getElementById('chatMessages').innerHTML = '';
  updateStatus();
}
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
document.getElementById('questionInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});
updateStatus();
</script>
</body>
</html>
